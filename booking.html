
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPL Ticket Booking Form</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- Navigation -->
    <header>
        <h1>IPL 2026 Ticket Booking</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="index.html#matches">Matches</a>
            <a href="booking.html">Book Ticket</a>
        </nav>
    </header>

    <!-- Booking Form -->
    <main class="booking-page">

        <h2>Ticket Booking Form</h2>
        <p>Fill in your details to book your IPL tickets.</p>

        <form action="#" method="get">

            <!-- Name -->
            <label for="name">Full Name:</label>
            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your full name"
                minlength="3"
                maxlength="40"
                pattern="[A-Za-z ]{3,40}"
                required>

            <!-- Email -->
            <label for="email">Email Address:</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required>

            <!-- Phone -->
            <label for="phone">Phone Number:</label>
            <input
                type="tel"
                id="phone"
                name="phone"
                placeholder="Enter 10 digit phone number"
                pattern="[6-9][0-9]{9}"
                minlength="10"
                maxlength="10"
                required>

            <!-- Match Selection -->
            <label for="match">Select Match:</label>
            <select id="match" name="match" required>
                <option value="" disabled selected>
                    Choose a match
                </option>
                <option value="RCB vs CSK">RCB vs CSK</option>
                <option value="MI vs KKR">MI vs KKR</option>
                <option value="SRH vs RCB">SRH vs RCB</option>
            </select>

            <!-- Stand Category -->
            <label for="stand">Stand Category:</label>
            <select id="stand" name="stand" required>
                <option value="" disabled selected>
                    Choose a stand
                </option>
                <option value="General">General</option>
                <option value="Premium">Premium</option>
                <option value="VIP">VIP</option>
            </select>

            <!-- Number of Tickets -->
            <label for="quantity">Number of Tickets:</label>
            <input
                type="number"
                id="quantity"
                name="quantity"
                min="1"
                max="10"
                required>

            <!-- Additional Preferences -->
            <p><strong>Additional Preferences:</strong></p>

            <label>
                <input type="checkbox" name="preference" value="SMS">
                Receive booking updates through SMS
            </label>

            <label>
                <input type="checkbox" name="preference" value="Email">
                Receive booking updates through Email
            </label>

            <!-- Buttons -->
            <button type="submit">Submit Booking</button>
            <button type="reset">Reset Form</button>

        </form>

    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 IPL Ticket Booking. All Rights Reserved.</p>
    </footer>

</body>
</html>
